services:
  db:
    image: mysql:8
    container_name: pricalica-e2e-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user
      MYSQL_PASSWORD: 11
      MYSQL_DATABASE: Pricalica
    ports:
      - '3306:3306'
    volumes:
      - ../PricalicaDB/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uuser', '-p11']
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ../PricalicaAPI
      dockerfile: Dockerfile
    container_name: pricalica-e2e-api
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: user
      DB_PASSWORD: 11
      DB_NAME: Pricalica
      PORT: 3000
      NODE_ENV: development
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  webapp:
    build:
      context: ../PricalicaWebApp/pricalicaWebApp
      dockerfile: Dockerfile.dev
    container_name: pricalica-e2e-webapp
    environment:
      CHOKIDAR_USEPOLLING: 'true'
      CHOKIDAR_INTERVAL: '100'
      WATCHPACK_POLLING: 'true'
      VITE_API_BASE_URL: 'http://api:3000'
    ports:
      - '9000:9000'
    volumes:
      - ../PricalicaWebApp/pricalicaWebApp:/app
      - pricalica_webapp_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:9000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    stdin_open: true
    tty: true

  playwright:
    image: mcr.microsoft.com/playwright:v1.53.0-jammy
    container_name: pricalica-e2e-playwright
    working_dir: /e2e
    environment:
      PLAYWRIGHT_BASE_URL: 'http://webapp:9000'
      PLAYWRIGHT_API_URL: 'http://api:3000'
    volumes:
      - .:/e2e
      - pricalica_e2e_node_modules:/e2e/node_modules
    depends_on:
      webapp:
        condition: service_healthy
    command: sh -c "npm install && npx playwright test"

volumes:
  pricalica_webapp_node_modules:
  pricalica_e2e_node_modules:
